# application.yaml configuration file
spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  docker:
    compose:
      enabled: false

  config:
    import: optional:file:.env[.properties]


server:
  servlet:
    context-path: /api/v1
